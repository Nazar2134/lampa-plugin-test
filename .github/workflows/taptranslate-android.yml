name: Tap Translate APK

on:
  push:
    paths:
      - "taptranslate-android/**"
      - ".github/workflows/taptranslate-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taptranslate-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew testLiteReleaseUnitTest testFullReleaseUnitTest
      - name: Build APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TapTranslate-apk
          path: taptranslate-android/app/build/outputs/apk/*/release/*.apk
